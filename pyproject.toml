[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enveloc"
version = ["version"]
description = "enveloc - envelope cross-correlation location method"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "CC0-1.0" }
authors = [
    { name = "Aaron Wech", email = "awech@usgs.gov" },
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cython",
    "obspy",
    "cartopy",
    "scikit-learn",
    "utm",
]

[project.urls]
Homepage = "https://github.com/awech/enveloc"
Download = "https://github.com/awech/enveloc/archive/v1.1.7.tar.gz"
Documentation = "https://enveloc.readthedocs.io/en/latest/index.html"

[tool.hatch.build.targets.wheel]
packages = ["enveloc"]

[tool.hatch.build.targets.sdist]
include = [
    "/enveloc",
    "/README.md",
    "/LICENSE",
]
